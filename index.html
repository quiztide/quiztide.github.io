---
layout: default
title: "Avaliações"
---

<!-- Hero Section -->
<section class="hero-section">
  <div class="hero-container">
    <div class="hero-badge">
      <span class="badge-dot"></span>
      <span data-i18n="hero_badge"></span>
    </div>
    <h1 class="hero-title" data-i18n="hero_title"></h1>
    <p class="hero-subtitle" data-i18n="hero_subtitle"></p>
  </div>
</section>

<!-- Filter & Search Toolbar -->
<section class="toolbar-section">
  <div class="toolbar-container">
    <div class="search-box">
      <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input type="text" id="quiz-search-input" data-i18n="[placeholder]search_placeholder;[aria-label]search_placeholder" class="search-input">
      <kbd class="search-shortcut" title="Search">/</kbd>
    </div>

    <div class="filter-chips-bar" id="tag-filter-bar" role="toolbar"></div>
  </div>
</section>

<!-- Cards Catalog Grid (Rendered Statically at Build Time) -->
<section class="catalog-section">
  <div class="catalog-container">
    <div class="catalog-meta">
      <span class="catalog-counter" id="catalog-count-label"></span>
    </div>

    <div class="quiz-grid" id="quiz-catalog-collection">
      {% for quiz in site.data.quizzes %}
        <article class="quiz-card"
                 data-quiz-id="{{ quiz.id }}"
                 data-tags-pt="{{ quiz.pt.tags | join: ',' | downcase }}"
                 data-tags-en="{{ quiz.en.tags | join: ',' | downcase }}"
                 data-tags-es="{{ quiz.es.tags | join: ',' | downcase }}"
                 data-search-pt="{{ quiz.pt.title | downcase }} {{ quiz.pt.subtitle | downcase }} {{ quiz.pt.category | downcase }} {{ quiz.pt.tags | join: ' ' | downcase }}"
                 data-search-en="{{ quiz.en.title | downcase }} {{ quiz.en.subtitle | downcase }} {{ quiz.en.category | downcase }} {{ quiz.en.tags | join: ' ' | downcase }}"
                 data-search-es="{{ quiz.es.title | downcase }} {{ quiz.es.subtitle | downcase }} {{ quiz.es.category | downcase }} {{ quiz.es.tags | join: ' ' | downcase }}">
          <a href="{{ quiz.url | relative_url }}" class="quiz-card-link">
            <div class="card-visual">
              <img src="{{ quiz.cover | relative_url }}" alt="" class="card-cover-img" loading="lazy">
              <span class="card-tag-badge"
                    data-text-pt="{{ quiz.pt.category }}"
                    data-text-en="{{ quiz.en.category }}"
                    data-text-es="{{ quiz.es.category }}">{{ quiz.pt.category }}</span>
            </div>
            <div class="card-body">
              <div class="card-stats-row">
                <span class="stat-badge tabular-nums">⏱ ~{{ quiz.est_minutes }} min</span>
                <span class="stat-dot">·</span>
                <span class="stat-badge card-stat-questions tabular-nums">
                  {{ quiz.questions_count }} <span data-i18n="questions_label"></span>
                </span>
              </div>
              <h2 class="card-title"
                  data-text-pt="{{ quiz.pt.title }}"
                  data-text-en="{{ quiz.en.title }}"
                  data-text-es="{{ quiz.es.title }}">{{ quiz.pt.title }}</h2>
              <p class="card-desc"
                 data-text-pt="{{ quiz.pt.subtitle }}"
                 data-text-en="{{ quiz.en.subtitle }}"
                 data-text-es="{{ quiz.es.subtitle }}">{{ quiz.pt.subtitle }}</p>
              <div class="card-footer">
                <span class="card-cta-label" data-i18n="start_quiz"></span>
                <svg class="card-cta-arrow" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
              </div>
            </div>
          </a>
        </article>
      {% endfor %}
    </div>

    <div id="no-results-msg" class="empty-state" style="display: none;">
      <p id="no-results-text" class="empty-text" data-i18n="no_results"></p>
      <button type="button" id="btn-reset-filters" class="btn btn-secondary btn-sm" data-i18n="clear_filters"></button>
    </div>
  </div>
</section>

<!-- Catalog Controller (Filtering, Search, and Staggered Animations) -->
<script src="{{ '/assets/js/catalog.js' | relative_url }}?v={{ site.time | date: '%s' }}"></script>
