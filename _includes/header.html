<header class="navbar">
  <div class="nav-container">
    <a href="{{ '/' | relative_url }}" class="brand" aria-label="Quiztide Home">
      <div class="brand-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M2 12c.6 0 1.2-.4 1.5-1 1.2-2.3 3.3-3.7 5.8-3.7 2.4 0 4.5 1.3 5.7 3.5.4.7 1.1 1.2 1.9 1.2h.1c.9 0 1.7-.5 2.1-1.3C19.8 9.3 20.8 8.7 22 8.7"></path>
          <path d="M2 17c.6 0 1.2-.4 1.5-1 1.2-2.3 3.3-3.7 5.8-3.7 2.4 0 4.5 1.3 5.7 3.5.4.7 1.1 1.2 1.9 1.2h.1c.9 0 1.7-.5 2.1-1.3C19.8 14.3 20.8 13.7 22 13.7"></path>
        </svg>
      </div>
      <span class="brand-title">Quiztide</span>
    </a>

    <div class="nav-actions">
      <nav class="nav-links" aria-label="Main navigation">
        <a href="{{ '/' | relative_url }}" class="nav-item" data-i18n="nav_home"></a>
        <a href="{{ '/about/' | relative_url }}" class="nav-item" data-i18n="nav_about"></a>
      </nav>

      <!-- Language Select Dropdown with Real Vector Flags -->
      <details class="lang-dropdown" id="lang-dropdown">
        <summary class="lang-dropdown-trigger" data-i18n="[aria-label]select_language">
          {% assign default_lang_meta = site.data.languages[site.default_lang] %}
          <img src="{{ default_lang_meta.flag | relative_url }}" alt="" class="current-flag-img" id="current-flag-img" width="20" height="15">
          <span class="current-lang-name" id="current-lang-name"></span>
          <svg class="dropdown-chevron" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polyline points="6 9 12 15 18 9"></polyline>
          </svg>
        </summary>

        <div class="lang-dropdown-menu" role="menu">
          {% for item in site.data.languages %}
            {% assign l = item[1] %}
            <button type="button" class="lang-option-item" onclick="window.setLanguage('{{ item[0] }}')" role="menuitem">
              <img src="{{ l.flag | relative_url }}" alt="" width="20" height="15" class="menu-flag-img">
              <span class="lang-label">{{ l.name }}</span>
            </button>
          {% endfor %}
        </div>
      </details>
    </div>
  </div>
</header>
