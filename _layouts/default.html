<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  
  <title>{% if page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }} - {{ site.tagline }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">

  <!-- Typography: Inter Variable & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <!-- Stylesheet -->
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}?v={{ site.time | date: '%s' }}">
  
  <!-- Minimalist Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌊</text></svg>">

  {% seo %}

  <!-- i18n Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/i18next@23.7.11/dist/umd/i18next.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/loc-i18next@0.1.6/dist/umd/loc-i18next.min.js"></script>

  <!-- i18n Global Setup -->
  <script>
    window.LANGUAGES = {{ site.data.languages | jsonify }};
    window.CURRENT_LANG = localStorage.getItem('quiztide_lang') || 'pt';
    window.isI18nReady = false;

    window.initI18n = function(callback) {
      if (!window.i18next || !window.locI18next) {
        setTimeout(function() { window.initI18n(callback); }, 20);
        return;
      }
      i18next.init({
        lng: window.CURRENT_LANG,
        resources: {
          pt: { translation: {{ site.data.i18n.pt | jsonify }} },
          en: { translation: {{ site.data.i18n.en | jsonify }} },
          es: { translation: {{ site.data.i18n.es | jsonify }} }
        }
      }, function() {
        window.localize = locI18next.init(i18next);
        window.localize('body');
        window.updateLangDropdown(i18next.language);
        window.isI18nReady = true;
        window.dispatchEvent(new CustomEvent('quiztide:i18nready', { detail: { lang: i18next.language } }));
        if (typeof callback === 'function') callback();
      });
    };

    window.setLanguage = function(lang) {
      window.CURRENT_LANG = lang;
      localStorage.setItem('quiztide_lang', lang);
      document.documentElement.lang = lang;

      i18next.changeLanguage(lang, function() {
        window.localize('body');
        window.updateLangDropdown(lang);
        window.dispatchEvent(new CustomEvent('quiztide:langchange', { detail: { lang: lang } }));
      });
    };

    window.updateLangDropdown = function(lang) {
      var l = window.LANGUAGES && window.LANGUAGES[lang];
      if (!l) return;
      var flagImg = document.getElementById('current-flag-img');
      var langName = document.getElementById('current-lang-name');
      if (flagImg) flagImg.src = l.flag;
      if (langName) langName.textContent = l.name;
      var dropdown = document.getElementById('lang-dropdown');
      if (dropdown) dropdown.removeAttribute('open');
    };
  </script>
</head>
<body class="site-body">
  {% include header.html %}

  <main class="site-main" id="main-content">
    {{ content }}
  </main>

  {% include footer.html %}

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      window.initI18n();

      // Close dropdown on click outside
      document.addEventListener('click', function(e) {
        var dropdown = document.getElementById('lang-dropdown');
        if (dropdown && dropdown.hasAttribute('open') && !dropdown.contains(e.target)) {
          dropdown.removeAttribute('open');
        }
      });
    });
  </script>
</body>
</html>
